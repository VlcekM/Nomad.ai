# Builds the Nomad Hub image and pushes it to Docker Hub (vlcekmato/nomad-hub) on every push to main that touches
# the hub. Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
name: Hub image

on:
  push:
    branches: [main]
    paths:
      - "Nomad.Hub/**"
      - "Nomad.Hub.Contracts/**"
      - "Nomad.Hub.Tests/**"
      - "Nomad.Core/Hub/**"
      - ".github/workflows/hub.yml"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Nomad.Hub.Tests -c Release

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Nomad.Hub/Dockerfile
          push: true
          tags: |
            vlcekmato/nomad-hub:latest
            vlcekmato/nomad-hub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
