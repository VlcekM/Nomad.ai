# Builds the Nomad Hub image and pushes it to GitHub Container Registry (ghcr.io/vlcekm/nomad-hub) on every push to
# main that touches the hub. Uses the workflow's own token: no secrets to set up.
name: Hub image

on:
  push:
    branches: [main]
    paths:
      - "Nomad.Hub/**"
      - "Nomad.Hub.Contracts/**"
      - "Nomad.Hub.Tests/**"
      - "Nomad.Core/Hub/**"
      - ".github/workflows/hub.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vlcekm/nomad-hub

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Nomad.Hub.Tests -c Release

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Nomad.Hub/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Links the package to this repository (its page, and who may see it).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=Nomad Hub
          cache-from: type=gha
          cache-to: type=gha,mode=max
