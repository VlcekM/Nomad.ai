# Manual release: Velopack packages of Nomad.App (NativeAOT) for win-x64 and linux-x64, attached to a v<version>
# release with Windows Setup and portable zip, Linux AppImage, update feeds and SHA256SUMS, plus the signed Android app
# (Nomad-android.apk) when the repository has the signing secrets (README, "Signing the Android app"). A full release is
# marked Latest. An installed Nomad.ai updates itself from these releases (README, "Install and update").
# Run it with: gh workflow run release.yml -f version=0.1.0
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.0 (CHANGELOG.md needs a '## v0.1.0' section)"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161 # must match the Velopack package in Nomad.App/Nomad.App.csproj
  DOTNET_ROLL_FORWARD: Major # vpk targets .NET 10; roll forward onto the .NET 11 runtime

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version '$v'"; exit 1; }
          [ -z "$(git tag -l "v$v")" ] || { echo "tag v$v already exists"; exit 1; }
          # The version's CHANGELOG.md section (from "## v<version>" to the next "## "): required.
          awk -v h="## v$v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md" || { echo "CHANGELOG.md has no non-empty '## v$v' section"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}/changes.md

  package-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # When Microsoft's download server is down (actions/setup-dotnet#794), the runner's preinstalled SDK is used.
      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          dotnet-version: 11.0.x

      - name: .NET SDK
        shell: bash
        run: |
          [ "${{ steps.dotnet.outcome }}" = success ] || echo "setup-dotnet failed; trying the preinstalled SDKs: $(dotnet --list-sdks | tr '\n' ' ')"
          dotnet --version

      - uses: actions/download-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          # NativeAOT links with Visual Studio's C++ tools, which the runner has. -p:Version overrides the default
          # version (CHANGELOG.md's newest heading, Directory.Build.props).
          dotnet publish Nomad.App -c Release -r win-x64 -p:Version="$VERSION" -o pub
          # --runtime: an x64 package (vpk assumes x86 without it). The changelog section goes into the package too: the
          # update prompt shows it when GitHub can't be asked.
          vpk pack --packId Nomad --packVersion "$VERSION" --packTitle "Nomad.ai" --packDir pub --mainExe Nomad.ai.exe \
            --runtime win-x64 --channel win-x64 --icon Nomad.App/Assets/nomad.ico --releaseNotes "$RUNNER_TEMP/changes.md" \
            --outputDir out

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: out
          if-no-files-found: error

  package-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: NativeAOT and AppImage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev squashfs-tools

      # When Microsoft's download server is down (actions/setup-dotnet#794), the runner's preinstalled SDK is used.
      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          dotnet-version: 11.0.x

      - name: .NET SDK
        run: |
          [ "${{ steps.dotnet.outcome }}" = success ] || echo "setup-dotnet failed; trying the preinstalled SDKs: $(dotnet --list-sdks | tr '\n' ' ')"
          dotnet --version

      - uses: actions/download-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet publish Nomad.App -c Release -r linux-x64 -p:Version="$VERSION" -o pub
          vpk pack --packId Nomad --packVersion "$VERSION" --packTitle "Nomad.ai" --packDir pub --mainExe Nomad.ai \
            --runtime linux-x64 --channel linux-x64 --icon Nomad.App/Assets/nomad.png --releaseNotes "$RUNNER_TEMP/changes.md" \
            --outputDir out

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: out
          if-no-files-found: error

  # The phone app (Nomad.Mobile.Android), signed with the key in the repository secrets. Without ANDROID_KEYSTORE_BASE64
  # the job only warns, and the release goes out without the APK.
  package-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Signing key
        id: key
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
        run: |
          if [ "$HAS_KEYSTORE" != true ]; then
            echo "::warning::No Android APK in this release: add the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (README, \"Signing the Android app\")."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$HAS_STORE_PASSWORD" = true ] && [ "$HAS_ALIAS" = true ] || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS is missing."; exit 1; }
          echo "present=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'

      # When Microsoft's download server is down (actions/setup-dotnet#794), the runner's preinstalled SDK is used.
      - uses: actions/setup-dotnet@v5
        if: steps.key.outputs.present == 'true'
        id: dotnet
        continue-on-error: true
        with:
          dotnet-version: 11.0.x

      - name: .NET SDK
        if: steps.key.outputs.present == 'true'
        run: |
          [ "${{ steps.dotnet.outcome }}" = success ] || echo "setup-dotnet failed; trying the preinstalled SDKs: $(dotnet --list-sdks | tr '\n' ' ')"
          dotnet --version

      # The Android workload needs JDK 17 or later.
      - uses: actions/setup-java@v5
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Android workload and SDK
        if: steps.key.outputs.present == 'true'
        run: |
          # The preinstalled SDK (no setup-dotnet) lives in a root-owned folder.
          dotnet workload install android || sudo "$(command -v dotnet)" workload install android
          # The runner's Android SDK, plus the platform and build tools this workload targets.
          dotnet build Nomad.Mobile.Android -t:InstallAndroidDependencies -f net11.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=true

      - name: Package
        if: steps.key.outputs.present == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/nomad.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          # The key's password may be the store's; the env: form keeps both off the command line.
          key_pass=ANDROID_KEY_PASSWORD
          [ -n "$ANDROID_KEY_PASSWORD" ] || key_pass=ANDROID_KEYSTORE_PASSWORD
          # The csproj turns the version's numeric part into Android's version code (2.9.0-beta.1 -> 20900).
          dotnet publish Nomad.Mobile.Android -c Release -f net11.0-android -p:Version="$VERSION" \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$keystore" -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:$key_pass -o pub
          rm -f "$keystore"
          mkdir out
          mv pub/*-Signed.apk out/Nomad-android.apk
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$build_tools/apksigner" verify --print-certs out/Nomad-android.apk
          "$build_tools/aapt2" dump badging out/Nomad-android.apk | grep -E "^(package|minSdkVersion|targetSdkVersion)"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: package-android
          path: out
          if-no-files-found: error

  release:
    needs: [version, package-windows, package-linux, package-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Every package-* artifact into one folder; package-android is missing when the signing secrets are.
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}

      - name: Checksums
        run: |
          cd out
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          sed -i 's#  \./#  #' SHA256SUMS

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # The app shows these notes without the Download section and GitHub's "Full Changelog" line.
          {
            cat "$RUNNER_TEMP/changes.md"; echo
            echo "## Download"; echo
            echo "- \`Nomad-win-x64-Setup.exe\` installs Nomad.ai for your Windows user (no admin rights) and keeps it up to date."
            echo "- \`Nomad-win-x64-Portable.zip\` runs from any folder, without updates."
            echo "- \`Nomad-linux-x64.AppImage\` runs on Linux x64 and keeps itself up to date."
            if [ -f out/Nomad-android.apk ]; then
              echo "- \`Nomad-android.apk\` is the phone app for Android 10 and later; open it on the phone to install."
            fi
            echo; echo "Verify downloads against \`SHA256SUMS\`. Install and sign in to the CLI for the agent you want to use."
          } > "$RUNNER_TEMP/notes.md"
          flags=(--latest)
          [ "$PRERELEASE" = true ] && flags=(--prerelease --latest=false)
          previous=$(git tag -l "v*" --sort=-v:refname | head -n1)
          [ -n "$previous" ] && flags+=(--generate-notes --notes-start-tag "$previous")
          gh release create "v$VERSION" $(find out -type f) --target "$GITHUB_SHA" \
            --title "Nomad.ai $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
