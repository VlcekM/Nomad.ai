# Manual release: a Velopack package of Nomad.App (one NativeAOT executable) for win-x64, attached to a v<version> release
# with Setup, the portable zip, the update feed and SHA256SUMS. A full release is marked Latest. An installed Nomad.ai
# updates itself from these releases (README, "Install and update"). Run it with: gh workflow run release.yml -f version=0.1.0
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.0 (CHANGELOG.md needs a '## v0.1.0' section)"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161 # must match the Velopack package in Nomad.App/Nomad.App.csproj

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version '$v'"; exit 1; }
          [ -z "$(git tag -l "v$v")" ] || { echo "tag v$v already exists"; exit 1; }
          # The version's CHANGELOG.md section (from "## v<version>" to the next "## "): required.
          awk -v h="## v$v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md" || { echo "CHANGELOG.md has no non-empty '## v$v' section"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}/changes.md

  package:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # When Microsoft's download server is down (actions/setup-dotnet#794), the runner's preinstalled SDK is used.
      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          dotnet-version: 10.0.x

      - name: .NET SDK
        shell: bash
        run: |
          [ "${{ steps.dotnet.outcome }}" = success ] || echo "setup-dotnet failed; trying the preinstalled SDKs: $(dotnet --list-sdks | tr '\n' ' ')"
          dotnet --version

      - uses: actions/download-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          # NativeAOT links with Visual Studio's C++ tools, which the runner has. -p:Version overrides the default
          # version (CHANGELOG.md's newest heading, Directory.Build.props).
          dotnet publish Nomad.App -c Release -r win-x64 -p:Version="$VERSION" -o pub
          # The changelog section goes into the package too: the update prompt shows it when GitHub can't be asked.
          vpk pack --packId Nomad --packVersion "$VERSION" --packTitle "Nomad.ai" --packDir pub --mainExe Nomad.exe \
            --channel win-x64 --icon Nomad.App/Assets/nomad.ico --releaseNotes "$RUNNER_TEMP/changes.md" --outputDir out

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: out
          if-no-files-found: error

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}

      - name: Checksums
        run: |
          cd out
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          sed -i 's#  \./#  #' SHA256SUMS

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # The app shows these notes without the Download section and GitHub's "Full Changelog" line.
          {
            cat "$RUNNER_TEMP/changes.md"; echo
            echo "## Download"; echo
            echo "- \`Nomad-win-x64-Setup.exe\` installs Nomad.ai for your Windows user (no admin rights) and keeps it up to date."
            echo "- \`Nomad-win-x64-Portable.zip\` runs from any folder, without updates."
            echo; echo "Verify downloads against \`SHA256SUMS\`. Nomad.ai needs the Claude Code CLI, installed and signed in."
          } > "$RUNNER_TEMP/notes.md"
          flags=(--latest)
          [ "$PRERELEASE" = true ] && flags=(--prerelease --latest=false)
          previous=$(git tag -l "v*" --sort=-v:refname | head -n1)
          [ -n "$previous" ] && flags+=(--generate-notes --notes-start-tag "$previous")
          gh release create "v$VERSION" $(find out -type f) --target "$GITHUB_SHA" \
            --title "Nomad.ai $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
